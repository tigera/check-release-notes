name: 'Validate release notes'
description: 'Check if a specified label is present on a PR, and, if so, ensure release notes exist.'
inputs:
  label-name:  # id of input
    description: 'The Github label that we want to check for'
    required: true
    default: 'release-note-required'
  github-token:
    description: >
      Token used to publish a separate "Release notes" commit status, whose
      description shows the reason on the pull request page. Needs
      statuses: write. When the status is created it carries the verdict and
      this step succeeds even on a failure, so make "Release notes" the
      required status check. Optional: without a token, or with the read-only
      token a fork PR gets, the action logs why and fails the step instead.
    required: false
runs:
  using: 'node24'
  main: 'dist/index.js'
