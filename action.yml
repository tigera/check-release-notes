name: 'Validate release notes'
description: 'Check if a specified label is present on a PR, and, if so, ensure release notes exist.'
inputs:
  label-name:  # id of input
    description: 'The Github label that we want to check for'
    required: true
    default: 'release-note-required'
  github-token:
    description: >
      Token used to publish a separate "Release notes" check run, whose title
      shows the reason on the pull request page. Needs checks: write. Optional:
      without it, or with the read-only token a fork PR gets, the action logs
      that it skipped the check run and reports the same verdict as before.
    required: false
runs:
  using: 'node24'
  main: 'dist/index.js'
